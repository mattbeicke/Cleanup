[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cleanup-assistant"
version = "1.2.1"
description = "A safe, local web app for reviewing files and folders"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "FastAPI>=0.115.0",
    "Send2Trash>=1.8.3",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27.0", "pytest>=8.0"]

[project.scripts]
cleanup-assistant = "api.web:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
