[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cleanup-assistant"
version = "1.0.0"
description = "A safe, interactive file and folder cleanup assistant"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Send2Trash>=1.8.3"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
cleanup-assistant = "cleanup_assistant.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
