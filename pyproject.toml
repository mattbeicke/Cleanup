[build-system]
requires = ["setuptools>=69.5.1"]
build-backend = "setuptools.build_meta"

[project]
name = "cleanup-assistant"
version = "1.2.1"
description = "A safe, local web app for reviewing files and folders"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "FastAPI>=0.141.1",
    "Send2Trash>=1.8.3",
    "uvicorn>=0.52.4",
    "requests>=2.34.2"
]

[project.optional-dependencies]
dev = ["httpx>=0.28.1", "pytest>=9.1.1"]

[project.scripts]
cleanup-assistant = "api.web:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
